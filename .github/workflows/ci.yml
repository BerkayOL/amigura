name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm install
      - name: Lint (JS/CSS/HTML)
        run: npm run lint

  lighthouse:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm install
      - name: Lighthouse CI
        run: npm run lighthouse:ci

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check (Lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,303,307,308,429
            --exclude '^data:'
            --exclude '^https://www\.amigura\.com/'
            --exclude '^https://www\.etsy\.com/'
            --exclude '^https://www\.instagram\.com/'
            --exclude-path css/fonts.css
            --timeout 20
            --max-concurrency 8
            .

